<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb Science Quiz PWA</title>
    <link rel="manifest" href="quiz.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .game-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 440px; padding: 24px; text-align: center; }
        .badge { background: #6366f1; color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; display: inline-block; margin-bottom: 20px; }
        
        .question-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .question { font-size: 16px; font-weight: 600; color: #f8fafc; line-height: 1.5; text-align: left; width: 100%; }
        
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .btn-option { background-color: #334155; border: 1px solid #475569; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; color: #f8fafc; cursor: pointer; transition: all 0.2s; text-align: left; line-height: 1.3; }
        .btn-option:hover:not(:disabled) { background-color: #475569; border-color: #64748b; }
        .btn-option:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .feedback-box { display: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
        .feedback-box.correct { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }

        .note-box { display: none; background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; font-size: 13px; color: #cbd5e1; text-align: left; margin-bottom: 15px; line-height: 1.4; }
        .note-box strong { color: #38bdf8; }

        .btn-next { background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; display: none; margin-bottom: 15px; transition: background 0.2s; }
        .btn-next:hover { background: #4338ca; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; font-weight: 600; padding-top: 12px; border-top: 1px solid #334155; }
        .high-score-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; color: #fbbf24; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="game-card">
        <span class="badge" id="progressBadge">ข้อที่ 1/10</span>
        
        <div class="question-box">
            <div class="question" id="questionText">กำลังโหลดคำถาม...</div>
        </div>
        
        <div class="options-grid" id="optionsContainer"></div>

        <div class="feedback-box" id="feedbackBox"></div>
        
        <div class="note-box" id="noteBox">
            📌 <strong>จุดจดความรู้:</strong> <span id="noteText"></span>
        </div>

        <button class="btn-next" id="btnNext" onclick="nextQuestion()">ข้อถัดไป ➔</button>

        <div class="status-bar">
            <span>คะแนนรอบนี้: <strong id="currentScore" style="color: #4ade80;">0</strong></span>
            <span>คะแนนสะสมรวม: <strong id="totalScore" style="color: #38bdf8;">0</strong></span>
        </div>

        <div class="high-score-box">
            ⭐ คะแนนสะสมสูงสุดที่เคยทำได้: <span id="maxHighScoreText" style="color: #f59e0b;">0</span> คะแนน
        </div>
    </div>
 <script>
        const rawQuizData = [
            {
                question: 'ปรากฏการณ์ที่น้ำได้รับความร้อนจนเดือด แล้วเปลี่ยนสถานะจากของเหลวกลายเป็นไอ เรียกว่ากระบวนการใด?',
                options: ['การควบแน่น', 'การระเหย (Evaporation)', 'การหลอมเหลว', 'การตกผลึก'],
                answer: 'การระเหย (Evaporation)',
                note: 'การระเหยและการกลายเป็นไอ เกิดขึ้นเมื่อโมเลกุลของของเหลวได้รับพลังงานความร้อนจนหลุดออกไปเป็นแก๊ส'
            },
            {
                question: 'กระบวนการที่พืชนำพลังงานแสงอาทิตย์ น้ำ และแก๊สคาร์บอนไดออกไซด์มาเปลี่ยนเป็นน้ำตาลและออกซิเจน เรียกว่าอะไร?',
                options: ['การสังเคราะห์ด้วยแสง (Photosynthesis)', 'การหายใจระดับเซลล์', 'การคายน้ำ', 'การงอกของเมล็ด'],
                answer: 'การสังเคราะห์ด้วยแสง (Photosynthesis)',
                note: 'คลอโรฟิลล์ในใบพืชจะทำหน้าที่รับพลังงานแสงมาใช้เป็นพลังงานในกระบวนการสร้างอาหารของพืช'
            },
            {
                question: 'กิริยาการเคลื่อนที่ของวัตถุที่ตกลงสู่พื้นโลกโดยมีเพียงแรงดึงดูดของโลกกระทำต่อวัตถุนั้น เรียกว่าอะไร?',
                options: ['การลอยตัว', 'การตกแบบเสรี (Free Fall)', 'แรงเหวี่ยง', 'การสะท้อน'],
                answer: 'การตกแบบเสรี (Free Fall)',
                note: 'การตกแบบเสรีเกิดขึ้นภายใต้แรงโน้มถ่วงเพียงอย่างเดียว วัตถุจะมีความเร่งคงที่ประมาณ 9.8 m/s²'
            },
            {
                question: 'ปฏิกิริยาเคมีเมื่อนำสารละลายกรดและเบสมาผสมรวมกัน จนเกิดกิริยาสะเทินได้เกลือกับน้ำ เรียกว่าอะไร?',
                options: ['ปฏิกิริยากลาง (Neutralization)', 'ปฏิกิริยาเผาไหม้', 'การย่อยสลาย', 'ออกซิเดชัน'],
                answer: 'ปฏิกิริยากลาง (Neutralization)',
                note: 'ไอออน H+ จากกรด รวมตัวกับ OH- จากเบส ได้เป็นโมเลกุลน้ำ (H2O) ส่งผลให้ความเป็นกรด-เบสลดลงจนเป็นกลาง'
            },
            {
                question: 'ปรากฏการณ์ที่มีหยดน้ำมาเกาะข้างแก้วน้ำเย็น เนื่องจากไอน้ำในอากาศสัมผัสความเย็นแล้วเปลี่ยนสถานะกลับเป็นของเหลว เรียกว่าอะไร?',
                options: ['การควบแน่น (Condensation)', 'การแช่แข็ง', 'การระเหิด', 'การหลอมเหลว'],
                answer: 'การควบแน่น (Condensation)',
                note: 'การควบแน่นเป็นกระบวนการคายความร้อน เกิดขึ้นเมื่อแก๊สหรือไอน้ำสัมผัสกับความเย็นจนกลั่นตัวกลายเป็นของเหลว'
            },
            {
                question: 'กระบวนการที่สสารเปลี่ยนสถานะจากของแข็งกลายเป็นของเหลวเมื่อได้รับความร้อน เช่น น้ำแข็งละลาย เรียกว่าอะไร?',
                options: ['การหลอมเหลว (Melting)', 'การแข็งตัว', 'การระเหิดกลับ', 'การกลั่น'],
                answer: 'การหลอมเหลว (Melting)',
                note: 'การหลอมเหลวคือการที่สสารเปลี่ยนสถานะจากของแข็งเป็นของเหลวโดยการดูดความร้อนเข้าไป'
            },
            {
                question: 'ปรากฏการณ์ที่สสารเปลี่ยนสถานะจากของแข็งกลายเป็นแก๊สโดยตรง โดยไม่ผ่านการเป็นของเหลวก่อน เช่น น้ำแข็งแห้ง เรียกว่าอะไร?',
                options: ['การระเหิด (Sublimation)', 'การควบแน่น', 'การระเหย', 'การตกผลึก'],
                answer: 'การระเหิด (Sublimation)',
                note: 'การระเหิดเกิดขึ้นเมื่ออนุภาคของของแข็งได้รับความร้อนแล้วแยกตัวกลายเป็นไอแก๊สทันที'
            },
            {
                question: 'แรงต้านทานการเคลื่อนที่ที่เกิดขึ้นระหว่างผิวสัมผัสของวัตถุสองชิ้นที่กำลังเคลื่อนที่ผ่านกัน เรียกว่าแรงอะไร?',
                options: ['แรงเสียดทาน (Friction)', 'แรงตึงผิว', 'แรงลอยตัว', 'แรงแม่เหล็ก'],
                answer: 'แรงเสียดทาน (Friction)',
                note: 'แรงเสียดทานจะมีทิศทางตรงข้ามกับการเคลื่อนที่ของวัตถุเสมอ ทำหน้าที่ช่วยยึดเกาะหรือต้านการสไลด์'
            },
            {
                question: 'กระบวนการทางชีวเคมีที่เซลล์สลายสารอาหารโดยใช้ออกซิเจน เพื่อนำพลังงานมาใช้ในร่างกาย เรียกว่ากระบวนการใด?',
                options: ['การหายใจระดับเซลล์ (Cellular Respiration)', 'การคายน้ำ', 'การหมัก', 'การย่อยอาหาร'],
                answer: 'การหายใจระดับเซลล์ (Cellular Respiration)',
                note: 'การหายใจระดับเซลล์คือการสลายน้ำตาลกลูโคสร่วมกับออกซิเจน ได้เป็นพลังงาน ATP แก๊สคาร์บอนไดออกไซด์ และน้ำ'
            },
            {
                question: 'ปรากฏการณ์ที่แสงเดินทางไปกระทบกับตัวกลางหรือพื้นผิว แล้วเด้งกลับออกมาในทิศทางตรงกันข้าม เรียกว่าอะไร?',
                options: ['การสะท้อนของแสง (Reflection)', 'การหักเหของแสง', 'การแทรกแทรก', 'การเลี้ยวเบน'],
                answer: 'การสะท้อนของแสง (Reflection)',
                note: 'การสะท้อนของแสงจะเกิดขึ้นตามกฎการสะท้อน คือ มุมตกกระทบจะเท่ากับมุมสะท้อนเสมอ'
            }
        ];
 let activeQuizList = [];
        let currentQ = 0;
        let score = 0;
        let totalScore = 0;
        let maxHighScore = parseInt(localStorage.getItem('verbQuizMaxHighScore')) || 0;

function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let newArray = JSON.parse(JSON.stringify(array));
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function initGame() {
            document.getElementById('maxHighScoreText').innerText = maxHighScore;
            startNewRound();
        }

        function startNewRound() {
            activeQuizList = shuffle(rawQuizData);
            currentQ = 0;
            score = 0;
            document.getElementById('currentScore').innerText = score;
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuizList[currentQ];
            document.getElementById('progressBadge').innerText = `ข้อที่ ${currentQ + 1}/10`;
            document.getElementById('questionText').innerText = `${currentQ + 1}. ${q.question}`;
            
            document.getElementById('feedbackBox').style.display = 'none';
            document.getElementById('noteBox').style.display = 'none';
            document.getElementById('btnNext').style.display = 'none';

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const shuffledOptions = shuffle(q.options);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
}

        function checkAnswer(selected, btn) {
            const allBtns = document.querySelectorAll('.btn-option');
            allBtns.forEach(b => b.disabled = true);

            const q = activeQuizList[currentQ];
            const feedbackBox = document.getElementById('feedbackBox');
            const noteBox = document.getElementById('noteBox');
            
            feedbackBox.style.display = 'block';
            noteBox.style.display = 'block';
            document.getElementById('noteText').innerText = q.note;

            if (selected === q.answer) {
                score += 10;
                totalScore += 10;
                
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = '✨ ถูกต้อง! (+10 คะแนน)';
                btn.style.backgroundColor = '#22c55e';
            } else {
                feedbackBox.className = 'feedback-box wrong';
                feedbackBox.innerHTML = `❌ ตอบผิด!<br><small style="color:#fff;">เฉลยข้อที่ถูกต้องคือ: <strong>${q.answer}</strong></small>`;
                btn.style.backgroundColor = '#ef4444';
            }

            document.getElementById('currentScore').innerText = score;
            document.getElementById('totalScore').innerText = totalScore;
            document.getElementById('btnNext').style.display = 'block';

            if (totalScore > maxHighScore) {
                maxHighScore = totalScore;
                localStorage.setItem('verbQuizMaxHighScore', maxHighScore);
                document.getElementById('maxHighScoreText').innerText = maxHighScore;
            }
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ >= activeQuizList.length) {
                alert(`🎉 ครบ 10 ข้อแล้ว!\nคะแนนรอบนี้: ${score}/100 คะแนน\nคะแนนสะสมรวม: ${totalScore} คะแนน\n\nเมื่อกดตกลง ระบบจะทำการสลับคำถามและตัวเลือกใหม่ทั้งหมดทันที!`);
                startNewRound();
            } else {
                loadQuestion();
            }
        }

        initGame();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('quiz.js')
                    .then(() => console.log('SW Registered'))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>
</html>
